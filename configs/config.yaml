# Zero-shot / fine-tuned evaluation of an audio LM agent on LifeMate (Zalo AI Challenge 2026).
# python run.py model=gemma4_e4b data=public_test          (one model and one split per run)
# python run.py model=kimi_audio data=train data.limit=100  (train has labels: scored locally)
defaults:
  - model: gemma4_e4b
  - data: public_test
  - _self_

data_root: /content/drive/MyDrive/it/zalo/data/raw/train+public_test   # holds train/ and public_test/
run_name: ${hydra:runtime.choices.model}_think${agent.enable_thinking}_${data.split}
out_dir: /content/drive/MyDrive/it/zalo/runs/${run_name}                # persistent: preds.jsonl grows per sample

agent:
  max_steps: 6          # model turns per sample; each turn may emit several tool calls
  max_new_tokens: 512     # with thinking on, the thought counts too: use 2048
  enable_thinking: false  # Gemma 4: <|think|> in the system prompt (chat template flag)

hydra:
  run:
    dir: ${out_dir}/hydra/${now:%Y%m%d_%H%M%S}
  job:
    chdir: false
